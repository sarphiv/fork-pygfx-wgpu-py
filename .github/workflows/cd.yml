# Build and publish custom platform wheels for this fork.
#
# This branch builds wgpu-native from a pinned trunk commit and publishes only
# GitHub Release assets. It must not publish to PyPI.

name: CD

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WGPU_NATIVE_REPO: https://github.com/gfx-rs/wgpu-native.git
  WGPU_NATIVE_COMMIT: 61efac8438bdbee4b93c1e111091d22120f1e1f3
  WEBGPU_HEADERS_COMMIT: 7d3186c3dd2c708703524027b46b8703534ab3cc
  WGPU_NATIVE_VERSION: 29.0.3.0

jobs:

  build-wheel:
    name: Build ${{ matrix.wheel_tag }} wheel
    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: linux_x86_64_wheel
            build_kind: manylinux
            runs_on: ubuntu-24.04
            os_name: linux
            wgpu_native_tag: linux_x86_64
            wheel_tag: manylinux_2_28_x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            python_architecture: x64
            rust_target: ""
            macos_deployment_target: ""
          - artifact_name: linux_aarch64_wheel
            build_kind: manylinux
            runs_on: ubuntu-24.04-arm
            os_name: linux
            wgpu_native_tag: linux_aarch64
            wheel_tag: manylinux_2_28_aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            python_architecture: arm64
            rust_target: ""
            macos_deployment_target: ""
          - artifact_name: macos_x86_64_wheel
            build_kind: native
            runs_on: macos-15-intel
            os_name: macos
            wgpu_native_tag: macos_x86_64
            wheel_tag: macosx_10_12_x86_64
            manylinux_image: ""
            python_architecture: x64
            rust_target: x86_64-apple-darwin
            macos_deployment_target: "10.12"
          - artifact_name: macos_aarch64_wheel
            build_kind: native
            runs_on: macos-15
            os_name: macos
            wgpu_native_tag: macos_aarch64
            wheel_tag: macosx_11_0_arm64
            manylinux_image: ""
            python_architecture: arm64
            rust_target: aarch64-apple-darwin
            macos_deployment_target: "11.0"
          - artifact_name: windows_x86_64_wheel
            build_kind: native
            runs_on: windows-2025
            os_name: windows
            wgpu_native_tag: windows_x86_64
            wheel_tag: win_amd64
            manylinux_image: ""
            python_architecture: x64
            rust_target: x86_64-pc-windows-msvc
            macos_deployment_target: ""
          - artifact_name: windows_i686_wheel
            build_kind: native
            runs_on: windows-2025
            os_name: windows
            wgpu_native_tag: windows_i686
            wheel_tag: win32
            manylinux_image: ""
            python_architecture: x86
            rust_target: i686-pc-windows-msvc
            macos_deployment_target: ""
          - artifact_name: windows_aarch64_wheel
            build_kind: native
            runs_on: windows-11-arm
            os_name: windows
            wgpu_native_tag: windows_aarch64
            wheel_tag: win_arm64
            manylinux_image: ""
            python_architecture: arm64
            rust_target: aarch64-pc-windows-msvc
            macos_deployment_target: ""

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_architecture }}

      - name: Set up Rust
        if: matrix.build_kind == 'native'
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          rustup default 1.87.0
          rustc --version

      - name: Install host build dependencies
        env:
          WGPU_PY_BUILD_NOARCH: "1"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U -e ".[build,codegen]"

      - name: Fetch pinned wgpu-native
        run: |
          git clone "$WGPU_NATIVE_REPO" downloads/wgpu-native
          git -C downloads/wgpu-native checkout "$WGPU_NATIVE_COMMIT"
          git -C downloads/wgpu-native submodule update --init --recursive
          test "$(git -C downloads/wgpu-native rev-parse HEAD)" = "$WGPU_NATIVE_COMMIT"
          test "$(git -C downloads/wgpu-native/ffi/webgpu-headers rev-parse HEAD)" = "$WEBGPU_HEADERS_COMMIT"
          grep -q 'WGPUNativeFeature_ShaderFloat32Atomic = 0x00030027' downloads/wgpu-native/ffi/wgpu.h

      - name: Run codegen verification
        run: |
          python codegen
          grep -q '"shader-float32-atomic": 196647' wgpu/backends/wgpu_native/_mappings.py

      - name: Build native platform wheel
        if: matrix.build_kind == 'native'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/downloads/wgpu-native/target
          WGPU_PY_BUILD_USE_BUNDLED_LIB: "1"
          WGPU_BUILD_PLATFORM_INFO: ${{ matrix.wgpu_native_tag }} ${{ matrix.wheel_tag }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_deployment_target }}
        run: |
          rm -rf dist
          python tools/build_pinned_wgpu_native.py \
            --checkout downloads/wgpu-native \
            --os "${{ matrix.os_name }}" \
            --target "${{ matrix.rust_target }}" \
            --native-version "$WGPU_NATIVE_VERSION" \
            --native-commit "$WGPU_NATIVE_COMMIT" \
            --webgpu-headers-commit "$WEBGPU_HEADERS_COMMIT"
          python -m build -n -w
          python -m twine check dist/*.whl

      - name: Build manylinux platform wheel
        if: matrix.build_kind == 'manylinux'
        run: |
          rm -rf dist
          HOST_UID="$(id -u)"
          HOST_GID="$(id -g)"
          docker run --rm \
            -v "$PWD:/io" \
            -w /io \
            -e CARGO_HOME=/io/downloads/cargo \
            -e RUSTUP_HOME=/io/downloads/rustup \
            -e CARGO_TARGET_DIR=/io/downloads/wgpu-native/target \
            -e HOST_UID="$HOST_UID" \
            -e HOST_GID="$HOST_GID" \
            -e WGPU_NATIVE_VERSION="$WGPU_NATIVE_VERSION" \
            -e WGPU_NATIVE_COMMIT="$WGPU_NATIVE_COMMIT" \
            -e WEBGPU_HEADERS_COMMIT="$WEBGPU_HEADERS_COMMIT" \
            -e WGPU_PY_BUILD_USE_BUNDLED_LIB=1 \
            -e WGPU_BUILD_PLATFORM_INFO="${{ matrix.wgpu_native_tag }} ${{ matrix.wheel_tag }}" \
            "${{ matrix.manylinux_image }}" \
            /bin/bash -euxo pipefail -c '
              if command -v dnf >/dev/null 2>&1; then
                PACKAGE_MANAGER=dnf
              elif command -v yum >/dev/null 2>&1; then
                PACKAGE_MANAGER=yum
              else
                echo "No supported package manager found to install libclang"
                exit 1
              fi
              "$PACKAGE_MANAGER" install -y clang
              LIBCLANG_FILE="$(find /usr/lib64 /usr/lib /opt/clang /opt/rh -name "libclang.so*" -print -quit 2>/dev/null || true)"
              if [[ -z "$LIBCLANG_FILE" ]]; then
                "$PACKAGE_MANAGER" install -y clang-devel
                LIBCLANG_FILE="$(find /usr/lib64 /usr/lib /opt/clang /opt/rh -name "libclang.so*" -print -quit 2>/dev/null || true)"
              fi
              if [[ -z "$LIBCLANG_FILE" ]]; then
                echo "libclang was not found after installing clang/clang-devel"
                exit 1
              fi
              export LIBCLANG_PATH="$(dirname "$LIBCLANG_FILE")"
              echo "Using LIBCLANG_PATH=$LIBCLANG_PATH"
              echo "#include <stddef.h>" | clang -x c -fsyntax-only -
              export PATH="$CARGO_HOME/bin:$PATH"
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.87.0
              . "$CARGO_HOME/env"
              cargo --version
              rustc --version
              git config --global --add safe.directory /io
              git config --global --add safe.directory /io/downloads/wgpu-native
              git config --global --add safe.directory /io/downloads/wgpu-native/ffi/webgpu-headers
              /opt/python/cp312-cp312/bin/python -m pip install --upgrade pip
              WGPU_PY_BUILD_NOARCH=1 /opt/python/cp312-cp312/bin/python -m pip install -U -e ".[build]"
              /opt/python/cp312-cp312/bin/python tools/build_pinned_wgpu_native.py \
                --checkout downloads/wgpu-native \
                --os linux \
                --native-version "$WGPU_NATIVE_VERSION" \
                --native-commit "$WGPU_NATIVE_COMMIT" \
                --webgpu-headers-commit "$WEBGPU_HEADERS_COMMIT"
              /opt/python/cp312-cp312/bin/python -m build -n -w
              auditwheel show dist/*.whl
              /opt/python/cp312-cp312/bin/python -m twine check dist/*.whl
              chown -R "$HOST_UID:$HOST_GID" dist wgpu/resources downloads
            '

      - name: Test wheel import and mapping
        run: |
          python -m venv "$RUNNER_TEMP/wgpu-wheel-test"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source "$RUNNER_TEMP/wgpu-wheel-test/Scripts/activate"
          else
            source "$RUNNER_TEMP/wgpu-wheel-test/bin/activate"
          fi
          python -m pip install --upgrade pip
          python -m pip install --force-reinstall dist/*.whl
          pushd "$RUNNER_TEMP"
          python - <<'PY'
          import wgpu.backends.wgpu_native as native
          from wgpu.backends.wgpu_native._mappings import enum_str2int

          assert native.lib_version_info == (29, 0, 3, 0), native.lib_version_info
          assert native.__commit_sha__ == "61efac8438bdbee4b93c1e111091d22120f1e1f3"
          assert enum_str2int["NativeFeature"]["shader-float32-atomic"] == 0x00030027
          print(native.lib_path)
          PY
          popd

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.whl
          name: ${{ matrix.artifact_name }}

  publish:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build-wheel]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten dist dir
        run: |
          find dist -mindepth 2 -type f -exec mv -f '{}' dist/ ';'
          rm -rf dist/*/

      - name: Set version from git ref
        run: echo "WGPU_PY_VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_ENV"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.WGPU_PY_VERSION }}
          name: ${{ env.WGPU_PY_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.whl
          body: |
            Custom native-only wgpu-py wheels exposing `shader-float32-atomic`.

            - wgpu-native commit: `61efac8438bdbee4b93c1e111091d22120f1e1f3`
            - webgpu-headers commit: `7d3186c3dd2c708703524027b46b8703534ab3cc`
            - wheel platform tags: `manylinux_2_28_x86_64`, `manylinux_2_28_aarch64`, `macosx_10_12_x86_64`, `macosx_11_0_arm64`, `win_amd64`, `win32`, `win_arm64`
            - feature spelling: `shader-float32-atomic`
            - numeric ID: `0x00030027`
            - native version metadata: `29.0.3.0`
            - local native dependency patches: `naga 29.0.3` validation allows workgroup float32 atomics; `wgpu-hal 29.0.3` Vulkan enables/requires shared float32 atomic capabilities
            - workflow validation: wheel install/import and feature mapping check on each target GitHub Actions runner
            - local hardware/backend validation: adapter reporting `shader-float32-atomic` via Vulkan; workgroup `atomic<f32>` shader pipeline created successfully
            - platform note: non-Linux wheels are packaged and import-tested, but native `shader-float32-atomic` availability still depends on the user's adapter/backend reporting the feature
          draft: false
          prerelease: true
