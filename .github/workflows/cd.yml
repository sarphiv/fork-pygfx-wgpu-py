# Build and publish the custom Linux wheel for this fork.
#
# This branch builds wgpu-native from a pinned trunk commit and publishes only
# GitHub Release assets. It must not publish to PyPI.

name: CD

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  WGPU_NATIVE_REPO: https://github.com/gfx-rs/wgpu-native.git
  WGPU_NATIVE_COMMIT: 61efac8438bdbee4b93c1e111091d22120f1e1f3
  WEBGPU_HEADERS_COMMIT: 7d3186c3dd2c708703524027b46b8703534ab3cc
  WGPU_NATIVE_VERSION: 29.0.3.0
  WGPU_WHEEL_PLATFORM_TAG: linux_x86_64

jobs:

  build-wheel:
    name: Build Linux x86_64 wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Rust
        run: |
          rustup toolchain install 1.87.0 --profile minimal
          rustup default 1.87.0
          rustc --version

      - name: Install build dependencies
        env:
          WGPU_PY_BUILD_NOARCH: "1"
        run: |
          python -m pip install --upgrade pip
          pip install -U -e .[build,codegen]

      - name: Fetch pinned wgpu-native
        run: |
          git clone "$WGPU_NATIVE_REPO" downloads/wgpu-native
          git -C downloads/wgpu-native checkout "$WGPU_NATIVE_COMMIT"
          git -C downloads/wgpu-native submodule update --init --recursive
          test "$(git -C downloads/wgpu-native rev-parse HEAD)" = "$WGPU_NATIVE_COMMIT"
          test "$(git -C downloads/wgpu-native/ffi/webgpu-headers rev-parse HEAD)" = "$WEBGPU_HEADERS_COMMIT"
          grep -q 'WGPUNativeFeature_ShaderFloat32Atomic = 0x00030027' downloads/wgpu-native/ffi/wgpu.h
          cmp downloads/wgpu-native/ffi/wgpu.h wgpu/resources/wgpu.h
          cmp downloads/wgpu-native/ffi/webgpu-headers/webgpu.h wgpu/resources/webgpu.h

      - name: Run codegen verification
        run: |
          python codegen
          grep -q '"shader-float32-atomic": 196647' wgpu/backends/wgpu_native/_mappings.py

      - name: Build pinned wgpu-native
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/downloads/wgpu-native/target
        run: |
          python tools/patch_wgpu_native_float32_atomic_workgroup.py downloads/wgpu-native
          WGPU_NATIVE_VERSION="$WGPU_NATIVE_VERSION" cargo build --release --manifest-path downloads/wgpu-native/Cargo.toml
          cp downloads/wgpu-native/target/release/libwgpu_native.so wgpu/resources/libwgpu_native-release.so
          python - <<'PY'
          import ctypes
          lib = ctypes.CDLL("wgpu/resources/libwgpu_native-release.so")
          version = lib.wgpuGetVersion()
          version_info = tuple((version >> bits) & 0xFF for bits in (24, 16, 8, 0))
          assert version_info == (29, 0, 3, 0), version_info
          PY

      - name: Build wheel
        env:
          WGPU_PY_BUILD_USE_BUNDLED_LIB: "1"
          WGPU_BUILD_PLATFORM_INFO: linux_x86_64 linux_x86_64
        run: |
          rm -rf dist
          python -m build -n -w
          twine check dist/*.whl

      - name: Test wheel import and mapping
        shell: bash
        run: |
          python -m venv /tmp/wgpu-wheel-test
          source /tmp/wgpu-wheel-test/bin/activate
          pip install --upgrade pip
          pip install --force-reinstall dist/*.whl
          pushd "$HOME"
          python - <<'PY'
          import wgpu.backends.wgpu_native as native
          from wgpu.backends.wgpu_native._mappings import enum_str2int

          assert native.lib_version_info == (29, 0, 3, 0), native.lib_version_info
          assert native.__commit_sha__ == "61efac8438bdbee4b93c1e111091d22120f1e1f3"
          assert enum_str2int["NativeFeature"]["shader-float32-atomic"] == 0x00030027
          print(native.lib_path)
          PY
          popd

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          path: dist/*.whl
          name: linux_x86_64_wheel

  publish:
    name: Publish to GitHub Releases
    runs-on: ubuntu-latest
    needs: [build-wheel]
    if: success() && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten dist dir
        run: |
          find dist -mindepth 2 -type f -exec mv -f '{}' dist/ ';'
          rm -rf dist/*/

      - name: Set version from git ref
        run: echo "WGPU_PY_VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_ENV"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.WGPU_PY_VERSION }}
          name: ${{ env.WGPU_PY_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/*.whl
          body: |
            Custom native-only wgpu-py wheel for Linux x86_64 exposing `shader-float32-atomic`.

            - wgpu-native commit: `61efac8438bdbee4b93c1e111091d22120f1e1f3`
            - webgpu-headers commit: `7d3186c3dd2c708703524027b46b8703534ab3cc`
            - wheel platform tag: `linux_x86_64`
            - feature spelling: `shader-float32-atomic`
            - numeric ID: `0x00030027`
            - native version metadata: `29.0.3.0`
            - local native dependency patches: `naga 29.0.3` validation allows workgroup float32 atomics; `wgpu-hal 29.0.3` Vulkan enables/requires shared float32 atomic capabilities
            - workflow validation: wheel install/import and feature mapping check on GitHub Actions `ubuntu-latest`
            - local hardware/backend validation: adapter reporting `shader-float32-atomic` via Vulkan; workgroup `atomic<f32>` shader pipeline created successfully
          draft: false
          prerelease: true
