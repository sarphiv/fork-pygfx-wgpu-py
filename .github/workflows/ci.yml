name: CI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  WGPU_PY_BUILD_NOARCH: "1"
  WGPU_NATIVE_REPO: https://github.com/gfx-rs/wgpu-native.git
  WGPU_NATIVE_COMMIT: 6aed50955d934ac36049ba8d002034841633ae02
  WEBGPU_HEADERS_COMMIT: 673658bc2bd70ec39fc55ebe6bb0173cf6d0a603
  WGPU_NATIVE_VERSION: 29.0.1.1

jobs:

  build-native-lib:
    name: Build pinned wgpu-native
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Set up Rust
      run: |
          rustup toolchain install 1.93 --profile minimal
          rustup default 1.93
          rustc --version
    - name: Fetch pinned wgpu-native
      run: |
          git clone "$WGPU_NATIVE_REPO" downloads/wgpu-native
          git -C downloads/wgpu-native checkout "$WGPU_NATIVE_COMMIT"
          git -C downloads/wgpu-native submodule update --init --recursive
          test "$(git -C downloads/wgpu-native rev-parse HEAD)" = "$WGPU_NATIVE_COMMIT"
          test "$(git -C downloads/wgpu-native/ffi/webgpu-headers rev-parse HEAD)" = "$WEBGPU_HEADERS_COMMIT"
          grep -q 'WGPUNativeFeature_Immediates = 0x00030001' downloads/wgpu-native/ffi/wgpu.h
          grep -q 'WGPUNativeFeature_ShaderFloat32Atomic = 0x00030027' downloads/wgpu-native/ffi/wgpu.h
          grep -q 'wgpuComputePassEncoderSetImmediates' downloads/wgpu-native/ffi/webgpu-headers/webgpu.h
          cmp downloads/wgpu-native/ffi/wgpu.h wgpu/resources/wgpu.h
          cmp downloads/wgpu-native/ffi/webgpu-headers/webgpu.h wgpu/resources/webgpu.h
    - name: Build pinned wgpu-native
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/downloads/wgpu-native/target
      run: |
          python tools/patch_wgpu_native_float32_atomic_workgroup.py downloads/wgpu-native
          WGPU_NATIVE_VERSION="$WGPU_NATIVE_VERSION" cargo build --release --manifest-path downloads/wgpu-native/Cargo.toml
          mkdir -p downloads/native-artifact
          cp downloads/wgpu-native/target/release/libwgpu_native.so downloads/native-artifact/libwgpu_native-release.so
          python - <<'PY'
          import ctypes

          lib = ctypes.CDLL("downloads/native-artifact/libwgpu_native-release.so")
          version = lib.wgpuGetVersion()
          version_info = tuple((version >> bits) & 0xFF for bits in (24, 16, 8, 0))
          assert version_info == (29, 0, 1, 1), version_info
          PY
    - name: Upload native library
      uses: actions/upload-artifact@v7
      with:
        name: linux_x86_64_native_lib
        path: downloads/native-artifact/libwgpu_native-release.so
        retention-days: 1

  lint-build:
    name: Test Linting
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          pip install ruff
    - name: Ruff lint
      run: |
          ruff check --output-format=github .
    - name: Ruff format
      run: |
          ruff format --check .

  test-codegen-build:
    name: Test Codegen
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          pip install -U -e .[codegen]
    - name: Test codegen
      run: |
          pytest -v codegen

  test-minimal-import-build:
    name: Test Imports
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
          python -m pip install --upgrade pip
          pip install -e .
    - name: Test imports
      run: |
          python -c "print('wgpu'); import wgpu; print(wgpu)"
          python -c "print('wgpu.utils'); import wgpu.utils"

  docs-build:
    name: Test Docs
    timeout-minutes: 5
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dev dependencies
      run: |
          python -m pip install --upgrade pip
          pip install -U -e .[docs]
    - name: Build docs
      run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going"

  test-examples-build:
    name: Test Examples
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: build-native-lib
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install llvmpipe and lavapipe for offscreen canvas
      run: |
        sudo apt-get update -y -qq
        sudo apt install -y libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers
    - name: Download native library
      uses: actions/download-artifact@v8
      with:
        name: linux_x86_64_native_lib
        path: wgpu/resources
    - name: Install dev dependencies
      env:
        WGPU_PY_BUILD_NOARCH: "0"
        WGPU_PY_BUILD_USE_BUNDLED_LIB: "1"
      run: |
          python -m pip install --upgrade pip
          pip install -U -e .[tests,examples]
    - name: Test examples
      env:
        EXPECT_LAVAPIPE: true
      run: |
          pytest -v examples

  test-pyinstaller-build:
    name: Test PyInstaller
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: build-native-lib
    strategy:
      fail-fast: false
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Download native library
      uses: actions/download-artifact@v8
      with:
        name: linux_x86_64_native_lib
        path: wgpu/resources
    - name: Install dependencies
      env:
        WGPU_PY_BUILD_NOARCH: "0"
        WGPU_PY_BUILD_USE_BUNDLED_LIB: "1"
      run: |
          python -m pip install --upgrade pip
          pip install -U .
          pip install -U pytest numpy psutil pyinstaller
    - name: Test PyInstaller
      run: |
          pushd $HOME
          pyinstaller --version
          pytest -v --pyargs wgpu.__pyinstaller

  test-builds:
    name: ${{ matrix.name }}
    timeout-minutes: 5
    runs-on: ${{ matrix.os }}
    needs: build-native-lib
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Test Linux py311
            os: ubuntu-latest
            pyversion: '3.11'
          - name: Test Linux py312
            os: ubuntu-latest
            pyversion: '3.12'
          - name: Test Linux py313
            os: ubuntu-latest
            pyversion: '3.13'
          - name: Test Linux py314
            os: ubuntu-latest
            pyversion: '3.14'
          - name: Test Linux pypy3
            os: ubuntu-latest
            pyversion: 'pypy3.11'
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.pyversion }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.pyversion }}
    - name: Install llvmpipe and lavapipe for offscreen canvas
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update -y -qq
        sudo apt install -y libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers
    - name: Download native library
      uses: actions/download-artifact@v8
      with:
        name: linux_x86_64_native_lib
        path: wgpu/resources
    - name: Install dev dependencies
      env:
        WGPU_PY_BUILD_NOARCH: "0"
        WGPU_PY_BUILD_USE_BUNDLED_LIB: "1"
      run: |
          python -m pip install --upgrade pip
          pip install -U -e .[tests]
          python -c "import wgpu; print(wgpu.__version__)"
    - name: Unit tests
      run: |
          pytest -v tests
    - name: Memory tests
      run: |
          pytest -v tests_mem
