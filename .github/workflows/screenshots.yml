name: Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  WGPU_PY_BUILD_NOARCH: "1"
  WGPU_NATIVE_REPO: https://github.com/gfx-rs/wgpu-native.git
  WGPU_NATIVE_COMMIT: 61efac8438bdbee4b93c1e111091d22120f1e1f3
  WEBGPU_HEADERS_COMMIT: 7d3186c3dd2c708703524027b46b8703534ab3cc
  WGPU_NATIVE_VERSION: 29.0.3.0

jobs:
  build-native-lib:
    name: Build pinned wgpu-native
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Set up Rust
      run: |
        rustup toolchain install 1.87.0 --profile minimal
        rustup default 1.87.0
        rustc --version
    - name: Fetch pinned wgpu-native
      run: |
        git clone "$WGPU_NATIVE_REPO" downloads/wgpu-native
        git -C downloads/wgpu-native checkout "$WGPU_NATIVE_COMMIT"
        git -C downloads/wgpu-native submodule update --init --recursive
        test "$(git -C downloads/wgpu-native rev-parse HEAD)" = "$WGPU_NATIVE_COMMIT"
        test "$(git -C downloads/wgpu-native/ffi/webgpu-headers rev-parse HEAD)" = "$WEBGPU_HEADERS_COMMIT"
        grep -q 'WGPUNativeFeature_ShaderFloat32Atomic = 0x00030027' downloads/wgpu-native/ffi/wgpu.h
        cmp downloads/wgpu-native/ffi/wgpu.h wgpu/resources/wgpu.h
        cmp downloads/wgpu-native/ffi/webgpu-headers/webgpu.h wgpu/resources/webgpu.h
    - name: Build pinned wgpu-native
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/downloads/wgpu-native/target
      run: |
        python tools/patch_wgpu_native_float32_atomic_workgroup.py downloads/wgpu-native
        WGPU_NATIVE_VERSION="$WGPU_NATIVE_VERSION" cargo build --release --manifest-path downloads/wgpu-native/Cargo.toml
        mkdir -p downloads/native-artifact
        cp downloads/wgpu-native/target/release/libwgpu_native.so downloads/native-artifact/libwgpu_native-release.so
        python - <<'PY'
        import ctypes

        lib = ctypes.CDLL("downloads/native-artifact/libwgpu_native-release.so")
        version = lib.wgpuGetVersion()
        version_info = tuple((version >> bits) & 0xFF for bits in (24, 16, 8, 0))
        assert version_info == (29, 0, 3, 0), version_info
        PY
    - name: Upload native library
      uses: actions/upload-artifact@v7
      with:
        name: linux_x86_64_native_lib
        path: downloads/native-artifact/libwgpu_native-release.so
        retention-days: 1

  screenshots:
    name: Regenerate screenshot
    timeout-minutes: 10
    runs-on: 'ubuntu-latest'
    needs: build-native-lib
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install llvmpipe and lavapipe for offscreen canvas
      run: |
        sudo apt-get update -y -qq
        sudo apt install -y libegl1-mesa-dev libgl1-mesa-dri libxcb-xfixes0-dev mesa-vulkan-drivers
    - name: Download native library
      uses: actions/download-artifact@v8
      with:
        name: linux_x86_64_native_lib
        path: wgpu/resources
    - name: Install dev dependencies
      env:
        WGPU_PY_BUILD_NOARCH: "0"
        WGPU_PY_BUILD_USE_BUNDLED_LIB: "1"
      run: |
        python -m pip install --upgrade pip
        pip install -U -e .[tests,examples]
    - name: Regenerate screenshots
      run: |
        pytest -v --regenerate-screenshots -k test_examples_screenshots examples
    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: screenshots
        path: examples/screenshots
